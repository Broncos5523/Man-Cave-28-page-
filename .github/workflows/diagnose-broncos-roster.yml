name: Diagnose public Broncos roster routes on Cloudflare (no writes)

on:
  push:
    paths:
      - .github/workflows/diagnose-broncos-roster.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose read-only public ESPN routes and proxy error
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json,time
          base="https://man-cave-28-page.broncos5523.workers.dev"
          public=[
          ("core-roster","https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/teams/7/athletes?limit=100"),
          ("core-typed","https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/types/2/teams/7/athletes?limit=100"),
          ("core-small","https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/teams/7/athletes?limit=2"),
          ("site-roster","https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/7/roster"),
          ("site-roster-abbr","https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/den/roster"),
          ("core-league","https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026")
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          def call(url):
              req=urllib.request.Request(url,headers={"User-Agent":"ManCavePublicSportsDiagnostic/1.0","Accept":"application/json"})
              try:
                  r=opener.open(req,timeout=12)
                  return r.status,r.headers,r.read(250)
              except urllib.error.HTTPError as e:
                  return e.code,e.headers,e.read(250)
              except Exception as e:return 0,{},str(e).encode()
          for name,url in public:
              for mode,endpoint in [
                ("direct",url),("cloudflare",base+"/proxy?url="+urllib.parse.quote(url,safe=""))
              ]:
                  status,headers,body=call(endpoint)
                  print("PROBE",name,mode,"HTTP",status,"TYPE",headers.get("Content-Type"),
                        "LOCATION",(headers.get("Location") or "")[:130],
                        "BODY",body.decode(errors="replace")[:210],flush=True)
          PY
