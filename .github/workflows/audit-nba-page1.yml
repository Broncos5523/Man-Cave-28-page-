name: Audit NBA Page 1 original render and 2027 ESPN source contracts

on:
  push:
    paths:
      - cloud-28/audit-nba-page1.py
      - .github/workflows/audit-nba-page1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python cloud-28/prepare.py
      - run: python cloud-28/audit-nba-page1.py
