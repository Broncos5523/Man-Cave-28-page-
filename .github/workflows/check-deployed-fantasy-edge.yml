name: Check deployed private Fantasy Worker safely (no secrets, no changes)
on:
  push:
    paths:
      - .github/workflows/check-deployed-fantasy-edge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public health and private route guard
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          base="https://man-cave-fantasy-cloud.broncos5523.workers.dev"
          req=urllib.request.Request(base+"/healthz",headers={"Accept":"application/json","User-Agent":"ManCaveFantasyHealth/1.0"})
          with urllib.request.urlopen(req,timeout=18) as response:
              info=json.load(response)
              assert response.status==200
          assert info.get("ok") is True and info.get("service")=="fantasy-edge"
          print("PASS: Fantasy Worker publicly reachable",flush=True)
          print("PRIVATE_CONFIGURATION_COMPLETE",bool(info.get("configured")),flush=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          for path in ("/","/api/data","/api/status","/static/man_cave_fantasy_logo.png"):
              try:
                  response=opener.open(urllib.request.Request(base+path,headers={"User-Agent":"ManCaveFantasyHealth/1.0"}),timeout=15)
                  status=response.status
              except urllib.error.HTTPError as err:status=err.code
              print("PRIVATE_ROUTE",path,"HTTP",status,flush=True)
              if status==403:
                  try:
                      body=err.read(3000).decode("utf-8","replace")
                      kind="Cloudflare challenge" if ("Just a moment" in body or "cf-challenge" in body) else ("Cloudflare error" if ("cloudflare" in body.lower() or "Error 10" in body) else ("App 403" if "forbidden" in body.lower() else "Other 403"))
                      print("ROUTE_403_KIND",path,kind,flush=True)
                  except Exception:pass
              assert status in (302,303,307,308,403),f"Unexpected private route HTTP {status} for {path}"
          print("PASS: dashboard, data API and artwork require a private session",flush=True)
          try:
              with urllib.request.urlopen(urllib.request.Request(base+"/setup",headers={"User-Agent":"ManCaveFantasyHealth/1.0"}),timeout=15) as response:
                  html=response.read(120000).decode("utf-8")
                  print("SETUP_ROUTE HTTP",response.status,"PRIVATE_FORM",("Private display passphrase" in html),flush=True)
                  assert response.status==200 and "Private display passphrase" in html
          except urllib.error.HTTPError as err:
              body=err.read(3000).decode("utf-8","replace")
              kind="Cloudflare challenge" if ("Just a moment" in body or "cf-challenge" in body) else ("Cloudflare error" if "cloudflare" in body.lower() else "Other 403")
              print("SETUP_ROUTE HTTP",err.code,"RESPONSE_KIND",kind,flush=True)
              print("SETUP_HEADERS", {k:err.headers.get(k) for k in ("Content-Type","Server","CF-Ray","Location","X-Content-Type-Options","Cache-Control")},flush=True)
              print("SETUP_BODY_PREFIX",repr(body[:250]),flush=True)
              raise
          print("PASS: private setup form reachable",flush=True)
          PY
