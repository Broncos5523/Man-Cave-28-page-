name: Check Fantasy Worker deployment credential readiness (no deployment)

on:
  push:
    paths:
      - '.github/workflows/check-fantasy-cloudflare-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-private-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Report only whether required Cloudflare credentials exist
        run: |
          if test -n "$CF_TOKEN"; then
            echo "CLOUDFLARE_API_TOKEN: CONFIGURED"
          else
            echo "CLOUDFLARE_API_TOKEN: MISSING"
          fi
          if test -n "$CF_ACCOUNT"; then
            echo "CLOUDFLARE_ACCOUNT_ID: CONFIGURED"
          else
            echo "CLOUDFLARE_ACCOUNT_ID: MISSING"
          fi
          echo "Preflight only: no token values or API requests are printed."
          echo "No Cloudflare deployment, worker changes, or Yahoo access attempted."
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" || { echo "Preflight failed: required secrets missing"; exit 1; }
          echo "PASS: both Fantasy Worker deploy credentials are present in GitHub Secrets."
