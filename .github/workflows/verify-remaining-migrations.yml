name: Verify remaining original sport renderers on Cloudflare
on:
  push:
    paths:
      - cloud-28/remaining-board-*.mjs
      - cloud-28/team-panels-contract.mjs
      - cloud-28/cloudflare-live-proxy.mjs
      - cloud-28/cloudflare-public-feed-shim.js
      - cloud-28/tests/browser-remaining-migrations.mjs
      - .github/workflows/verify-remaining-migrations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderers:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - run: node --test cloud-28/tests/*.test.mjs
      - name: Wait for the matching Cloudflare build
        run: |
          python - <<'PY'
          import json,time,urllib.request
          u='https://man-cave-28-page.broncos5523.workers.dev/migration-api/health'
          for attempt in range(30):
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'ManCavePublicSportsDiagnostic/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:d=json.load(r)
              if d.get('adapterRevision')=='remaining-r1':break
            except Exception as e: print(type(e).__name__,str(e)[:150],flush=True)
            time.sleep(10)
          else:raise SystemExit('Matching deployment not verified')
          PY
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare all remaining Page 1–3 DOMs against verified source JSON
        run: node cloud-28/tests/browser-remaining-migrations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-board-renderer-evidence
          path: |
            remaining-render-matrix.json
            *-render.png
