name: Verify remaining original sport renderers on Cloudflare
on:
  push:
    paths:
      - cloud-28/remaining-board-*.mjs
      - cloud-28/team-panels-contract.mjs
      - cloud-28/cloudflare-live-proxy.mjs
      - cloud-28/cloudflare-public-feed-shim.js
      - cloud-28/tests/browser-remaining-migrations.mjs
      - .github/workflows/verify-remaining-migrations.yml
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  renderers:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - run: node --test cloud-28/tests/*.test.mjs
      - name: Wait for this exact commit to finish deploying
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python cloud-28/tests/wait-cloudflare-deployment.py
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare all remaining Page 1–3 DOMs against verified source JSON
        run: node cloud-28/tests/browser-remaining-migrations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-board-renderer-evidence
          path: |
            remaining-render-matrix.json
            *-render.png
