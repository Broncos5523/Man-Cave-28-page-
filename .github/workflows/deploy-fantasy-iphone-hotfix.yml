name: Deploy iPhone login fix to isolated Fantasy Worker (one-time)
on:
  push:
    paths:
      - '.github/workflows/deploy-fantasy-iphone-hotfix.yml'
permissions:
  contents: read
jobs:
  deploy-only-fantasy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify existing private settings are present without viewing values
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 secret list --config fantasy-edge/wrangler.jsonc --format json > /tmp/fantasy-before.json
          node - <<'NODE'
          const fs=require("node:fs");
          const names=new Set(JSON.parse(fs.readFileSync("/tmp/fantasy-before.json","utf8")).map(x=>x.name));
          for(const name of ["FANTASY_VIEW_PIN","FANTASY_SESSION_SECRET","YAHOO_CLIENT_ID","YAHOO_CLIENT_SECRET","YAHOO_LEAGUE_ID"]){
            if(!names.has(name))throw Error("Required private Cloudflare setting missing: "+name);
          }
          console.log("PASS: all existing secrets confirmed, values kept private");
          NODE
      - name: Verify login and Yahoo form protections, then reproduce original dashboard assets
        run: |
          set -euo pipefail
          node --test fantasy-edge/*.test.mjs
          python fantasy-edge/build_assets.py
      - name: Deploy ONLY separate man-cave-fantasy-cloud Worker
        run: npx --yes wrangler@4 deploy --config fantasy-edge/wrangler.jsonc
      - name: Verify credentials survived and the private login is reachable
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config fantasy-edge/wrangler.jsonc --format json > /tmp/fantasy-after.json
          node - <<'NODE'
          const fs=require("node:fs");
          const before=new Set(JSON.parse(fs.readFileSync("/tmp/fantasy-before.json","utf8")).map(x=>x.name));
          const after=new Set(JSON.parse(fs.readFileSync("/tmp/fantasy-after.json","utf8")).map(x=>x.name));
          for(const name of before)if(!after.has(name))throw Error("Previously configured secret missing after deploy: "+name);
          console.log("PASS: all private credentials retained after deploy");
          NODE
          python - <<'PY'
          import json,urllib.request
          base="https://man-cave-fantasy-cloud.broncos5523.workers.dev"
          h={"User-Agent":"ManCaveFantasyHealth/1.0"}
          with urllib.request.urlopen(urllib.request.Request(base+"/healthz",headers=h),timeout=20) as r:
              health=json.load(r)
          assert health["ok"] is True and health["configured"] is True
          with urllib.request.urlopen(urllib.request.Request(base+"/setup",headers=h),timeout=20) as r:
              page=r.read().decode()
          assert 'name=\'form_token\'' in page
          assert 'Private display passphrase' in page
          print("PASS: Fantasy Worker healthy, fully configured, signed form displayed")
          PY
