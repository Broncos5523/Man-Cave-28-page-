name: Research ESPN Site basketball Player Page4 fallback (read-only)
on:
  push:
    branches: [audit/page1-page4-freshness-20261122]
    paths:
      - .github/workflows/probe-basketball-page4-site.yml
permissions:
  contents: read
jobs:
  research:
    if: github.ref == 'refs/heads/audit/page1-page4-freshness-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare public ESPN season/team rows direct and through Cloudflare
        run: python cloud-28/tests/probe-current-basketball-site-stats.py
