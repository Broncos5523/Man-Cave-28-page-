name: Verify Cloudflare Pages static asset build (no deployment)

on:
  push:
    paths:
      - cloud-28/build_cloudflare_assets.py
      - .github/workflows/smoke-cloudflare-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify original v8l archive
        run: python cloud-28/prepare.py
      - name: Build static assets exactly as Cloudflare Pages would
        run: python cloud-28/build_cloudflare_assets.py
      - name: Validate public output
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("cloud-28/cloudflare-static-dist")
          m=json.loads((p/"manifest.json").read_text())
          assert m["assetCount"]>=300
          assert "staging-only" in m["status"]
          assert len(list((p/"cdn-inline").iterdir()))==m["assetCount"]
          assert all(hashlib.sha256((p/entry["path"].lstrip("/")).read_bytes()).hexdigest()==entry["sha256"] for entry in m["assets"])
          assert max(entry["bytes"] for entry in m["assets"])<=25*1024*1024
          assert "immutable" in (p/"_headers").read_text()
          print("PASS_CLOUDFLARE_PAGES_ASSETS",m["assetCount"],m["totalBytes"],flush=True)
          PY
