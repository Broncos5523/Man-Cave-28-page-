name: Release preflight - snapshot live Cloudflare Worker (NO DEPLOY)
on:
  push:
    branches: [release/cloudflare-quota-20261122]
    paths:
      - .github/workflows/cloudflare-release-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: man-cave-28-production-release
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/release/cloudflare-quota-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify approved release branch and production Wrangler target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          config=json.loads(re.sub(r'^\s*//.*$', '',Path('wrangler.jsonc').read_text(),flags=re.M))
          assert config['name']=='man-cave-28-page'
          assert config['main']=='./cloud-28/cloudflare-live-proxy.mjs'
          assert config['assets']['directory']=='./cloud-28/cloudflare-static-dist'
          assert config['assets']['run_worker_first']==['/proxy','/migration-api/*','/staging/api/*','/api/board/*','/production/api/*']
          print('PASS_PRODUCTION_CONFIG_TARGET_AND_ROUTES')
          PY
      - name: Snapshot existing production deployment WITHOUT MUTATION
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 deployments status --config wrangler.jsonc --json > production-before.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          raw=Path('production-before.json').read_text()
          try:
              obj=json.loads(raw)
          except json.JSONDecodeError:
              match=re.search(r'[\[{]',raw)
              if match is None:raise
              obj=json.JSONDecoder().raw_decode(raw[match.start():])[0]
          print('DEPLOYMENT_STATUS_SHAPE',type(obj).__name__)
          print('DEPLOYMENT_STATUS_KEYS',sorted(obj.keys()) if isinstance(obj,dict) else 'array')
          # Record ID(s) without exposing configuration, secrets or request logs.
          versions=obj.get('versions',[]) if isinstance(obj,dict) else obj
          for item in versions if isinstance(versions,list) else []:
              if not isinstance(item,dict):continue
              print('PRODUCTION_VERSION_RECORD',json.dumps({
                 k:v for k,v in item.items() if k in
                 ('version_id','versionId','id','percentage','trafficPercentage','created_on')
              }))
          if not obj:raise SystemExit('Empty deployment snapshot; refuse deployment')
          print('PASS_PRODUCTION_DEPLOYMENT_SNAPSHOT_RECORDED')
          PY
      - name: Dry-run exact approved release build and Worker bundle
        shell: bash
        run: |
          python cloud-28/prepare.py
          python cloud-28/build_cloudflare_assets.py
          python cloud-28/tests/staging_runtime_images.test.py
          node --test cloud-28/tests/request-budget.test.mjs cloud-28/tests/worker-proxy.test.mjs cloud-28/tests/staging-image-helper.test.mjs
          npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run --outdir ./_release-dryrun
      - name: Preserve pre-deployment version and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-28-release-preflight
          retention-days: 21
          if-no-files-found: ignore
          path: |
            production-before.json
            _release-dryrun/
