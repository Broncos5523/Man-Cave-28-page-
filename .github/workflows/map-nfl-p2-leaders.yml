name: Map original NFL Page 2 leader labels to current ESPN stats (read-only)

on:
  push:
    paths:
      - cloud-28/map_nfl_p2_leaders.py
      - .github/workflows/map-nfl-p2-leaders.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python cloud-28/prepare.py
      - run: python cloud-28/map_nfl_p2_leaders.py
