name: Authorized 28-board current-stat repair at existing TV URL (auto rollback)
on:
  push:
    branches: [release/page1-page4-freshness-20261122]
    paths:
      - .github/workflows/deploy-current-stats-release.yml
permissions:
  contents: read
concurrency:
  group: man-cave-28-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/release/page1-page4-freshness-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm unchanged approved artwork and precisely scoped stats changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ac3a73b4efe1e49a993e3213bb19f4a2a29a4365 HEAD
          changed="$(git diff --name-only ac3a73b4efe1e49a993e3213bb19f4a2a29a4365 HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -v -E '^(cloud-28/(basketball-site-season-fallback\.mjs|build_cloudflare_visual_staging\.py|page4-live-api\.mjs|tv3-remote\.js|tests/(basketball-site-season-fallback\.test\.mjs|browser-page4-migrations\.mjs|browser-same-url-receiver\.mjs))|\.github/workflows/(preview-page4-freshness|verify-page4-live-site-fallback|test-cloudflare-live-relay|deploy-current-stats-release)\.yml)$' | grep -q .; then
            echo "Unexpected source changes: refusing production release"; exit 1
          fi
          python - <<'PY'
          import json,re
          from pathlib import Path
          c=json.loads(re.sub(r'^\s*//.*$','',Path('wrangler.jsonc').read_text(),flags=re.M))
          assert c['name']=='man-cave-28-page'
          assert c['main']=='./cloud-28/cloudflare-live-proxy.mjs'
          assert c['assets']['directory']=='./cloud-28/cloudflare-static-dist'
          assert c['assets']['run_worker_first']==['/proxy','/migration-api/*','/staging/api/*','/api/board/*','/production/api/*']
          print('PASS_SAME_CLOUDFLARE_WORKER_AND_ROUTING')
          PY
      - name: Snapshot and pin current live Worker version before update
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status --config wrangler.jsonc --json > "$RUNNER_TEMP/before.json"
          python - "$RUNNER_TEMP/before.json" <<'PY'
          import json,re,sys
          from pathlib import Path
          t=Path(sys.argv[1]).read_text()
          try:d=json.loads(t)
          except json.JSONDecodeError:
            p=re.search(r'[\[{]',t)
            assert p
            d=json.JSONDecoder().raw_decode(t[p.start():])[0]
          active=[(v.get('version_id'),v.get('percentage')) for v in d.get('versions',[])]
          original='711647a7-f63d-4df1-a8f9-455db32d1070'
          assert active==[(original,100)],'Production version changed; abort to protect existing TVs'
          print('PASS_ROLLBACK_SOURCE_VERSION_VERIFIED',original)
          PY
      - name: Verify verified current-season player sources and source integrity
        run: |
          set -euo pipefail
          node --test cloud-28/tests/basketball-site-season-fallback.test.mjs cloud-28/tests/page4-live.test.mjs cloud-28/tests/worker-proxy.test.mjs cloud-28/tests/request-budget.test.mjs
          python cloud-28/prepare.py
          python cloud-28/build_cloudflare_assets.py
          python cloud-28/tests/staging_runtime_images.test.py
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('cloud-28/cloudflare-static-dist/staging')
          p=(root/'player.html').read_text()
          r=(root/'tv3-remote.js').read_text()
          assert p.count('/staging/tv3-remote.js?v=stats-refresh-r2')==1
          assert 'command-refreshed' in r and 'lastAssignmentStamp' in r and 'mcSend=' in r
          assert "app.database().ref('screens/third').on('value'" in r
          assert "update(ref(db" not in r
          assert len(list((root/'boards').glob('*.html')))==28
          m=json.loads((root/'boards.json').read_text())
          assert len(m['boards'])==28 and m['duration_ms']==30000
          assert "const DUR=30000" in (root/'player.js').read_text()
          print('PASS_ALL_28_ORIGINAL_VISUALS_PLUS_SAME_BOARD_REFRESH')
          PY
          npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run --outdir ./_stats-release-dryrun
      - name: Deploy approved stats transport update to existing production Worker
        id: deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.jsonc --strict --keep-vars --message "User-requested fresh Page 1/4 stats and same-board resend; unchanged v8l designs"
      - name: Verify live production original address, player rotation and 2026/27 stats
        id: smoke
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          import urllib.request,urllib.error,json,time
          base='https://man-cave-28-page.broncos5523.workers.dev'
          checks=[
           ('/staging/player.html?rotate=off','player'),
           ('/staging/tv3-remote.js?v=stats-refresh-r2','receiver'),
           ('/staging/boards.json','manifest'),
           ('/api/board/page1_nfl','page1_nfl'),
           ('/api/board/page1_nba','page1_nba'),
           ('/production/api/page4-live?board=page4_celtics','page4_celtics'),
           ('/production/api/page4-live?board=page4_arizona_cbb','page4_arizona_cbb'),
           ('/production/api/page4-live?board=page4_fever','page4_fever')
          ]
          for path,kind in checks:
            last=None
            for attempt in range(3):
              try:
                url=base+path+('&' if '?' in path else '?')+'stats-release=20261122'
                req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 ManCaveCurrentStatsRelease/1.0',
                  'Cache-Control':'no-cache','Accept':'application/json,text/html,*/*'})
                with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status==200
                  data=r.read(3200000)
                if kind=='player':
                  assert data.count(b'/staging/tv3-remote.js?v=stats-refresh-r2')==1
                  assert b'/staging/player.js' in data
                elif kind=='receiver':
                  assert b'lastAssignmentStamp' in data and b'command-refreshed' in data
                  assert b'screens/third' in data
                else:
                  obj=json.loads(data)
                  if kind=='manifest':
                    assert len(obj['boards'])==28 and obj['duration_ms']==30000
                  elif kind.startswith('page1'):
                    assert obj['dataState']=='current'
                    assert obj['context']['year']==(2026 if kind=='page1_nfl' else 2027)
                    stamp=datetime.fromisoformat(obj['fetchedAt'].replace('Z','+00:00'))
                    assert (datetime.now(timezone.utc)-stamp).total_seconds()<600
                  else:
                    assert obj.get('dataState')=='current'
                    assert obj.get('season')==(2026 if kind=='page4_fever' else 2027)
                    assert obj.get('verifiedPlayers',0)>=3
                    stamp=datetime.fromisoformat(obj['updatedAt'].replace('Z','+00:00'))
                    assert (datetime.now(timezone.utc)-stamp).total_seconds()<900
                print('PASS_LIVE_CURRENT_STATS_RELEASE',kind)
                last=None
                break
              except Exception as e:
                last=type(e).__name__+': '+str(e)[:130]
                if attempt<2:time.sleep(7)
            if last:raise RuntimeError('Live release verification failed '+kind+' '+last)
          print('PASS_PRODUCTION_SAME_URL_AND_CURRENT_PAGE1_PAGE4_FEEDS')
          PY
      - name: Record active version for rollback and audit
        if: steps.deployment.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status --config wrangler.jsonc --json > "$RUNNER_TEMP/after.json"
          python - "$RUNNER_TEMP/after.json" <<'PY'
          import json,re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text()
          try:d=json.loads(raw)
          except json.JSONDecodeError:
            p=re.search(r'[\[{]',raw)
            assert p
            d=json.JSONDecoder().raw_decode(raw[p.start():])[0]
          versions=[(v.get('version_id'),v.get('percentage')) for v in d.get('versions',[])]
          assert len(versions)==1 and versions[0][1]==100
          assert versions[0][0]!='711647a7-f63d-4df1-a8f9-455db32d1070'
          print('PASS_NEW_STATS_VERSION_ACTIVE',versions[0][0])
          print('ROLLBACK_VERSION','711647a7-f63d-4df1-a8f9-455db32d1070')
          PY
      - name: Auto rollback to previously working production Worker if live verification fails
        if: failure() && steps.deployment.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 rollback 711647a7-f63d-4df1-a8f9-455db32d1070 --config wrangler.jsonc --message "Automatic rollback after failed Page1/Page4 stats release verification"
          echo "ROLLED_BACK_STATS_UPDATE_TO_PRIOR_TV_WORKER"
