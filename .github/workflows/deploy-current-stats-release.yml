name: Guard against a duplicate Page1/Page4 production rollout
on:
  push:
    branches: [release/page1-page4-freshness-20261122]
    paths:
      - .github/workflows/deploy-current-stats-release.yml
permissions:
  contents: read
concurrency:
  group: man-cave-28-production-release
  cancel-in-progress: false
jobs:
  no-duplicate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify only one authorized production workflow performs rollout
        run: |
          echo "No duplicate production deploy. The guarded release in workflow run 45083336959 is the sole production rollout."
          echo "This job deliberately performs no Cloudflare write, and cannot change any TV."
