name: Probe ESPN Site alternative for Arizona Page4 live seasonal leaders
on:
  push:
    branches: [audit/remaining-page4-native-20261122]
    paths: [.github/workflows/probe-arizona-page4-site.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check whether athlete leaderboard supports server-side Arizona team filter
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const root='https://site.api.espn.com/apis/common/v3/sports/football/college-football/statistics/byathlete?season=2026&seasontype=2&groups=80&limit=8&sort=passing.passingYards:desc';
          const options=['team=12','teamId=12','teams=12','team.id=12','teamid=12','team=Arizona'];
          for(const param of options){
            try {
              const resp=await fetch(root+'&'+param,{signal:AbortSignal.timeout(13000),headers:{Accept:'application/json'}});
              const d=await resp.json();
              const athletes=(d.athletes||[]).slice(0,5).map(x=>({name:x.athlete?.displayName,
                teamId:x.athlete?.team?.id||x.athlete?.teamId||x.team?.id,
                athleteKeys:Object.keys(x.athlete||{}).slice(0,12),categoryNames:x.categories?.map(c=>c.name).slice(0,3)}));
              console.log('TEAM_FILTER_PROBE',JSON.stringify({param,status:resp.status,rows:d.athletes?.length,
                requestedSeason:d.requestedSeason?.year,athletes}));
            }catch(e){console.log('TEAM_FILTER_PROBE_ERROR',JSON.stringify({param,error:String(e)}));}
          }
          JS
