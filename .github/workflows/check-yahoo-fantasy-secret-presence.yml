name: Check Yahoo Fantasy Worker secret presence (read only)
on:
  push:
    paths:
      - .github/workflows/check-yahoo-fantasy-secret-presence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check only names of installed Cloudflare Worker secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 secret list --config fantasy-edge/wrangler.jsonc --format json > /tmp/safe-secret-list.json
          node - <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('/tmp/safe-secret-list.json','utf8'));
          if(!Array.isArray(x))throw Error('Cloudflare returned unexpected secret-name response');
          const names = new Set(x.map(i=>i.name));
          for(const k of ['FANTASY_VIEW_PIN','FANTASY_SESSION_SECRET','YAHOO_CLIENT_ID','YAHOO_CLIENT_SECRET','YAHOO_LEAGUE_ID']){
            console.log(k+': '+(names.has(k)?'PRESENT':'MISSING'));
          }
          console.log('No secret values were read or printed.');
          NODE
