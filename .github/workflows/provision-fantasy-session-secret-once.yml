name: Provision Fantasy encryption secret only once (private, no value logged)

on:
  push:
    paths:
      - '.github/workflows/provision-fantasy-session-secret-once.yml'

permissions:
  contents: read

jobs:
  provision-one-time-session-key:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure production access is set and never replace existing session encryption key
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 secret list --config fantasy-edge/wrangler.jsonc --format json > /tmp/fantasy-secret-names.json
          node - <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync("/tmp/fantasy-secret-names.json","utf8"));
          if(!Array.isArray(x))throw Error("Cannot safely parse secret list");
          const names=x.map(o=>o.name);
          if(!names.includes("FANTASY_VIEW_PIN"))throw Error("Private dashboard passphrase missing: aborting");
          if(names.includes("FANTASY_SESSION_SECRET"))throw Error("Session encryption secret already present: refusing to rotate");
          console.log("PASS: owner passphrase exists; session encryption key not yet provisioned");
          NODE
      - name: Generate 384-bit cryptographic key directly into encrypted Cloudflare Worker secret
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("base64url"))' |
            npx --yes wrangler@4 secret put FANTASY_SESSION_SECRET --config fantasy-edge/wrangler.jsonc
          echo "PASS: stable session encryption secret installed without printing value"
      - name: Verify only the key's presence
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config fantasy-edge/wrangler.jsonc --format json > /tmp/fantasy-secret-names-after.json
          node - <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync("/tmp/fantasy-secret-names-after.json","utf8"));
          if(!x.some(o=>o.name==="FANTASY_SESSION_SECRET"))throw Error("Session key missing after upload");
          if(!x.some(o=>o.name==="FANTASY_VIEW_PIN"))throw Error("Owner passphrase missing after upload");
          console.log("PASS: session encryption key and owner passphrase both securely installed");
          NODE
