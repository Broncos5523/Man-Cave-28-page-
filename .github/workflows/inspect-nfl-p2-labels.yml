name: Compare NFL Page 2 approved player labels and ESPN leader identity

on:
  push:
    paths:
      - cloud-28/inspect-nfl-p2-labels.py
      - .github/workflows/inspect-nfl-p2-labels.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python cloud-28/prepare.py
      - run: python cloud-28/inspect-nfl-p2-labels.py
