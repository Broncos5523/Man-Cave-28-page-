name: Targeted Arizona Football Page4 player readiness
on:
  push:
    branches: [main]
    paths:
      - cloud-28/tests/browser-arizona-rotation-target.mjs
      - .github/workflows/diagnose-arizona-rotation-target.yml
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  targeted-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify the repaired nested lifecycle is actually served by Cloudflare
        run: |
          python - <<'PY'
          import time,urllib.request
          url='https://man-cave-28-page.broncos5523.workers.dev/hosted/page4_arizona_cfb/'
          for n in range(18):
              try:
                  data=urllib.request.urlopen(urllib.request.Request(
                      url,headers={'Cache-Control':'no-cache','User-Agent':'ManCaveArizonaReadinessQA/1.0'}),timeout=15).read()
                  if (b'window.__MC_PRODUCTION_BOARD="page4_arizona_cfb"' in data and
                      b'<script src="/staging/board-runtime-ancestor.js"></script>' in data):
                      print('ARIZONA_NESTED_REAL_LIFECYCLE_DEPLOYED',len(data),flush=True)
                      break
                  print('NESTED_LIFECYCLE_NOT_YET_PUBLISHED',n+1,flush=True)
              except Exception as e:
                  print('NESTED_LIFECYCLE_CHECK_ERROR',n+1,str(e)[:160],flush=True)
              if n<17:time.sleep(8)
          else:raise SystemExit('Cloudflare does not serve the nested original MCBoard lifecycle yet')
          PY
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Record actual iframe and readiness messages around Arizona Page4
        run: node cloud-28/tests/browser-arizona-rotation-target.mjs
      - name: Preserve actionable source and screenshot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arizona-player-target-readiness
          retention-days: 14
          path: |
            arizona-player-target.json
            arizona-player-target.png
