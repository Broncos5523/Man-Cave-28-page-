<!-- Staging receiver display-only orientation controls.
     Separate from approved v8l board markup. Never reads/writes Firebase. -->
<style>
#mc-tv3-rotate-button,#mc-tv3-rotate-menu{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.3;box-sizing:border-box}
#mc-tv3-rotate-button{position:fixed;right:12px;bottom:12px;z-index:2147483646;display:block;
 background:rgba(8,23,37,.88);border:1px solid #559ab5;color:#f3f9ff;padding:9px 12px;
 min-height:44px;min-width:94px;border-radius:10px;font-size:13px;font-weight:800;
 cursor:pointer;opacity:.65;transition:opacity .2s}
#mc-tv3-rotate-button:focus-visible,#mc-tv3-rotate-button:hover{opacity:1;outline:3px solid #f4d271;outline-offset:2px}
#mc-tv3-rotate-menu[hidden]{display:none!important}
#mc-tv3-rotate-menu{position:fixed;right:12px;bottom:64px;z-index:2147483647;
 width:min(345px,calc(100vw - 24px));background:#0a1a2d;color:#f4f9ff;border:2px solid #57a0bb;
 border-radius:15px;padding:17px;box-shadow:0 12px 38px rgba(0,0,0,.83);font-size:14px}
#mc-tv3-rotate-menu strong{font-size:17px;display:block;margin-bottom:4px}
#mc-tv3-rotate-menu p{margin:4px 0 12px;color:#afccdf;font-size:12px}
#mc-tv3-rotate-menu .mc-tv3-rotation-choices{display:grid;gap:9px}
#mc-tv3-rotate-menu button{border:1px solid #4c708e;background:#163957;color:#fff;border-radius:10px;
 padding:13px;text-align:left;font:800 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:45px;cursor:pointer}
#mc-tv3-rotate-menu button[data-mode].selected{border-color:#90efcc;background:#17564f}
#mc-tv3-rotate-menu button:focus-visible{outline:3px solid #f4d271;outline-offset:2px}
#mc-tv3-rotate-menu button[data-close]{width:100%;margin-top:10px;text-align:center;background:#192438}
@media(prefers-reduced-motion:reduce){#mc-tv3-rotate-button{transition:none}}
</style>
<button id="mc-tv3-rotate-button" type="button" aria-expanded="false" aria-controls="mc-tv3-rotate-menu">↻ Rotate</button>
<div id="mc-tv3-rotate-menu" role="region" aria-label="Onn display orientation" hidden>
  <strong>Screen orientation</strong>
  <p id="mc-tv3-rotate-description">Choose the direction that makes the board upright. Your selected TV board stays assigned.</p>
  <div class="mc-tv3-rotation-choices">
    <button type="button" data-mode="off">Off · no rotation</button>
    <button type="button" data-mode="cw">↻ Clockwise · 90° right</button>
    <button type="button" data-mode="ccw">↺ Counterclockwise · 90° left</button>
  </div>
  <button type="button" data-close="1">Close</button>
</div>
<script>
(function(){
'use strict';
var toggle=document.getElementById('mc-tv3-rotate-button');
var menu=document.getElementById('mc-tv3-rotate-menu');
if(!toggle||!menu)return;
var mode=new URLSearchParams(location.search).get('rotate')||'off';
if(!/^(off|cw|ccw)$/.test(mode))mode='off';
function mark(){
 var choices=menu.querySelectorAll('button[data-mode]');
 for(var i=0;i<choices.length;i++){
  var selected=choices[i].getAttribute('data-mode')===mode;
  choices[i].classList.toggle('selected',selected);
  choices[i].setAttribute('aria-pressed',selected?'true':'false');
 }
 toggle.title='Screen rotation: '+({off:'Off',cw:'Clockwise',ccw:'Counterclockwise'}[mode]);
}
function show(open){
 menu.hidden=!open;toggle.setAttribute('aria-expanded',open?'true':'false');
 if(open){var active=menu.querySelector('button.selected');if(active)active.focus();}
 else toggle.focus();
}
toggle.addEventListener('click',function(){show(menu.hidden)});
menu.addEventListener('click',function(e){
 var button=e.target.closest('button');
 if(!button)return;
 if(button.hasAttribute('data-close')){show(false);return;}
 var chosen=button.getAttribute('data-mode');
 if(!/^(off|cw|ccw)$/.test(chosen))return;
 if(chosen===mode){show(false);return;}
 var url=new URL(location.href);
 url.searchParams.set('rotate',chosen);
 // Orientation changes only this Cloudflare receiver's URL, not Firebase,
 // TV assignments, original Gold Master, or other screens.
 location.assign(url.href);
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&!menu.hidden){e.preventDefault();show(false);}
});
mark();
})();
</script>
